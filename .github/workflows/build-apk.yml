      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WRP-v03-Beta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create Source ZIP
        run: |
          zip -qr WRP-v03-Source.zip \
            settings.gradle build.gradle gradle.properties app/build.gradle app/src/main

      - name: Upload Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WRP-v03-Source-ZIP
          path: WRP-v03-Source.zip
          if-no-files-found: error
          retention-days: 14
