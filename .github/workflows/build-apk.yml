
name: WRP Android APK - ZIP Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'WRP-Projectmm-Complete.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4

      - name: Unpack WRP source ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f WRP-Projectmm-Complete.zip || {
            echo 'ERROR: Upload WRP-Projectmm-Complete.zip to the repository root first.'
            exit 1
          }

          unzip -oq WRP-Projectmm-Complete.zip -d .

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo 'WRP Android source is ready.'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "Android SDK: $SDK"

          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -x "$SDK/build-tools/35.0.0/aapt2" ]; then

            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

            test -x "$MANAGER" || {
              echo 'ERROR: sdkmanager not found'
              exit 1
            }

            "$MANAGER" --sdk_root="$SDK" --install \
              'platforms;android-35' \
              'build-tools;35.0.0'
          fi

          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"

          echo 'SDK 35 ready.'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate built APK
        shell: bash
        run: |
          set -euo pipefail

          APK=app/build/outputs/apk/debug/app-debug.apk

          test -s "$APK"
          unzip -tq "$APK" >/dev/null

          ls -lh "$APK"

      - name: Upload WRP Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WRP-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
